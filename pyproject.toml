[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kv-cache-lab"
version = "0.1.0"
description = "KV Cache management, benchmarking and visualization for LLM serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7"]

[tool.setuptools.packages.find]
include = ["kv_cache_lab*"]
